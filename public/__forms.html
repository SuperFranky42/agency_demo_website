<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Static copies so Netlify can register these forms at deploy time. -->
    <form name="quote" action="/form-received" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input type="hidden" name="subject" value="New quote request" />
      <p hidden>
        <label>Do not fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="business" />
      <input type="text" name="industry" />
      <input type="text" name="website" />
      <input type="text" name="need" />
      <input type="text" name="package" />
      <input type="text" name="outcome" />
      <input type="text" name="features" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="existing" />
      <input type="text" name="reference" />
      <textarea name="notes"></textarea>
    </form>

    <form name="book-call" action="/form-received" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="book-call" />
      <input type="hidden" name="subject" value="New call request" />
      <p hidden>
        <label>Do not fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="topic" />
      <input type="text" name="reference" />
      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
